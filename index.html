<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" aria-live="polite"></p>
  <section id="answer" aria-label="Результат разбора" hidden>
    <p>Тема: <strong id="topic"></strong></p>
    <h2>Черновик ответа</h2>
    <pre id="draft"></pre>
  </section>
  <script type="module">
    const form = document.querySelector("form");
    const button = form.querySelector("button");
    const status = document.querySelector("#status");
    const answer = document.querySelector("#answer");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const topicLabels = {
      delivery: "Доставка",
      pricing: "Стоимость",
      other: "Другое",
    };

    function clearAnswer() {
      answer.hidden = true;
      topic.textContent = "";
      draft.textContent = "";
    }

    function showManualReview() {
      clearAnswer();
      status.textContent = "Не удалось автоматически разобрать заявку. Требуется ручной разбор.";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearAnswer();
      button.disabled = true;
      status.textContent = "Разбираем заявку…";

      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: document.querySelector("#message").value }),
        });
        const body = await reply.json();

        if (body.status === "invalid_input") {
          status.textContent = "Введите непустой текст заявки.";
        } else if (
          reply.ok
          && body.status === "ready"
          && topicLabels[body.topic]
          && typeof body.draft === "string"
          && body.draft.trim() !== ""
        ) {
          status.textContent = "Черновик готов. Проверьте его перед отправкой клиенту.";
          topic.textContent = topicLabels[body.topic];
          draft.textContent = body.draft;
          answer.hidden = false;
        } else {
          showManualReview();
        }
      } catch {
        showManualReview();
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
